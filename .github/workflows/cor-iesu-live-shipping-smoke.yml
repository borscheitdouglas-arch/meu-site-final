name: Cor Iesu — 44 variacoes e frete real sem cobranca
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cor-iesu-live-shipping-smoke.yml"
permissions:
  contents: read
jobs:
  frete:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validar 44 SKUs e calcular frete sem iniciar pagamento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          base='https://douglas-loja-api.liturgia-gregoriano.workers.dev'
          hdr={'Origin':'https://www.douglasassumpcao.com.br','User-Agent':'Douglas-Cor-Iesu-ReadOnly'}
          with urllib.request.urlopen(urllib.request.Request(base+'/api/checkout/live/readiness',headers=hdr),timeout=20) as response:
              ready=json.load(response)
          colors=['marrom','branco','preto','off-white','azul-marinho','azul-royal','verde','cinza-claro','cinza-escuro','areia','bordo']
          names=['cor-iesu-'+color+'-'+size for color in colors for size in ('p','m','g','gg')]
          published=ready.get('availableSkus') or []
          missing=[x for x in names if x not in published]
          assert ready.get('checkoutEnabled') is True,ready
          assert ready.get('paymentProvider')=='infinitepay',ready
          assert not missing,f'Variacoes nao habilitadas: {missing}'
          assert len(names)==44
          print('44 combinacoes aprovadas pelo Worker, sem gerar pagamento.')
          for sku in ('cor-iesu-branco-p','cor-iesu-azul-royal-g','cor-iesu-bordo-gg','cor-iesu-marrom-m'):
              body=json.dumps({'zipCode':'01001000','sku':sku}).encode()
              req=urllib.request.Request(base+'/api/shipping/preview',data=body,headers={**hdr,'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=24) as response:
                  assert response.status==200
                  data=json.load(response)
              assert data.get('mode')=='preview' and data.get('provisional') is True,sku
              assert data.get('checkoutEnabled') is False
              assert data.get('options') and any(o.get('isActive') and o.get('shippingCost',-1)>=0 for o in data['options'])
              assert '5691' not in json.dumps(data) and 'D000007' not in json.dumps(data)
              print(sku+': cotacao real retornada, sem pagamento ou rascunho.')
          PY
