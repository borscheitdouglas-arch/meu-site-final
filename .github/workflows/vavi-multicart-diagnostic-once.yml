name: VAVI - estudo pontual de frete de carrinho combinado
on:
  push:
    branches: [main]
    paths: [.github/workflows/vavi-multicart-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar VAVI sem efetuar pagamento ou compra
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          from urllib.error import HTTPError,URLError
          url='https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/internal/combo-bdeffca5ff8864d8f030faaea4762e790d629acd260278627df80ab326c2ea9d0237f2ed892c5c83'
          req=urllib.request.Request(url,headers={'User-Agent':'Douglas-Multi-Freight-Diagnostic-1'})
          try:
            with urllib.request.urlopen(req,timeout=110) as r: result=json.load(r)
          except (HTTPError,URLError,TimeoutError) as e: raise SystemExit(type(e).__name__)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if len(result.get('cases',[]))!=6: raise SystemExit('API diagnostics incomplete')
          PY
