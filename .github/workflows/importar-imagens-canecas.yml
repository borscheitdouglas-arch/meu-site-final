name: Importar imagens individuais das canecas
on:
  push:
    paths:
      - ".github/workflows/importar-imagens-canecas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar-imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importar arquivos das duas canecas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/loja/Salve-Regina/web
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://at.adobe.com/ZvpU6eIaLQ81aRo6" \
            --output assets/img/loja/Salve-Regina/web/caneca-partitura-individual.png
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://at.adobe.com/ndlq0Ft2tCL6t3K9" \
            --output assets/img/loja/Salve-Regina/web/caneca-nossa-senhora-individual.png
          python3 - <<'PY'
          from pathlib import Path
          for stem in ('caneca-partitura-individual', 'caneca-nossa-senhora-individual'):
              path = Path('assets/img/loja/Salve-Regina/web') / (stem + '.png')
              data = path.read_bytes()
              if len(data) < 50000 or not data.startswith(bytes.fromhex('89504e470d0a1a0a')):
                  raise SystemExit(f'Imagem invalida: {path} ({len(data)} bytes)')
              print(f'Imagem conferida: {path} ({len(data)} bytes)')
          PY
      - name: Registrar imagens no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/loja/Salve-Regina/web/caneca-*-individual.png
          git commit -m "assets(loja): imagens individuais das duas canecas"
          git push
