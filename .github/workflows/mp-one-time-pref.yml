name: Gerar uma única preferência MP de homologação
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mp-one-time-pref.yml"
permissions:
  contents: read
jobs:
  test-preference-once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Executar sondagem apenas uma vez após publicação Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          URL="https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/internal/mp/test-once-910d8fa2852ee1c649afda44"
          for attempt in $(seq 1 25); do
            CODE=$(curl -sS --request POST -o /tmp/result.json --connect-timeout 8 --max-time 35 -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Sondagem executada, resultado registrado no D1."
              exit 0
            fi
            if [ "$CODE" = "503" ]; then
              echo "Sondagem executada, Mercado Pago retornou falha. Diagnóstico está no D1."
              exit 0
            fi
            echo "Versão ainda não disponível (HTTP $CODE): tentativa $attempt/25"
            sleep 12
          done
          echo "Sondagem indisponível."
          exit 1
