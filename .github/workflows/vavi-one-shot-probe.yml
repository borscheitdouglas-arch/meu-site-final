name: Diagnóstico único de frete VAVI (sem pagamentos)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vavi-one-shot-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invocar diagnóstico isolado após implantação do Worker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/internal/vavi/probe-6f820e5c4feca7c988cf5a12d163ae60"
          for attempt in $(seq 1 25); do
            HTTP_CODE=$(curl -sS -o /tmp/vavi-probe.json --connect-timeout 8 --max-time 30 -w '%{http_code}' "$URL" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Diagnóstico invocado. Resultado detalhado disponível apenas no D1."
              exit 0
            fi
            echo "Worker ainda não pronto para diagnóstico (HTTP $HTTP_CODE); tentativa $attempt/25"
            sleep 12
          done
          echo "Diagnóstico não foi invocado; não foram criados pedidos nem pagamentos."
          exit 1
