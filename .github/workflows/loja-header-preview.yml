name: Prévia visual do cabeçalho da loja
on:
  pull_request:
    paths:
      - 'styles/storefront-iluminura.css'
      - 'pages/loja.html'
      - 'pages/cart.html'
      - 'scripts/cart.js'
      - 'styles/store-cart.css'
      - 'styles/storefront-cards-dense.css'
      - 'content/shop-cart-catalog.json'
      - 'assets/img/loja/friso-iluminado-gregoriano.svg'
      - 'assets/img/loja/faixa-iluminada-gregoriana.svg'
      - 'tools/capture_store_header_preview.py'
      - '.github/workflows/loja-header-preview.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar Chromium
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
      - name: Capturar cabeçalho em desktop e celular
        run: python3 tools/capture_store_header_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: cabecalho-iluminura-preview
          path: header-previews/
          retention-days: 7
