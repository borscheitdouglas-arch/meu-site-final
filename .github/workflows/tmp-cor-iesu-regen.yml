name: Preparar arquivos gerados do lançamento Cor Iesu
on:
  push:
    branches:
      - preparar-venda-acessorios-cor-iesu-20261113
    paths:
      - '.github/workflows/tmp-cor-iesu-regen.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar Worker
        working-directory: integrations/vavi-worker
        run: node --test
      - name: Regenerar catálogo e sitemap
        run: |
          python3 tools/generate_store.py
          python3 tools/generate_sitemap.py
          python3 tools/generate_store.py --check
          python3 tools/generate_sitemap.py --check
          git diff --stat
      - name: Publicar somente arquivos gerados na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/loja.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'build: sincronizar catálogo e sitemap da pré-venda'
            git push origin HEAD:preparar-venda-acessorios-cor-iesu-20261113
          fi
