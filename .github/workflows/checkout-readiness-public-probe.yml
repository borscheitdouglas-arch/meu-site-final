name: Conferir disponibilidade real do checkout sem cobrar
# Nova verificação após a publicação da API InfinitePay em 2026-11-04.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkout-readiness-public-probe.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar estado de pagamento publicado
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/checkout/live/readiness'
          req=urllib.request.Request(url,headers={'Origin':'https://www.douglasassumpcao.com.br','User-Agent':'Douglas-Readiness-ReadOnly-20261103'})
          with urllib.request.urlopen(req,timeout=20) as r:
            d=json.load(r)
          print(json.dumps({
            'checkoutEnabled':d.get('checkoutEnabled'),
            'paymentProvider':d.get('paymentProvider'),
            'multiCheckoutEnabled':d.get('multiCheckoutEnabled'),
            'availableSkus':d.get('availableSkus'),
            'keys':list(d.keys())
          },ensure_ascii=False,indent=2))
          PY

      - name: Validar carrinho de duas camisetas G sem criar pedido
        run: |
          python3 - <<'PY'
          import json,urllib.request
          origin='https://www.douglasassumpcao.com.br'
          api='https://douglas-loja-api.liturgia-gregoriano.workers.dev'
          req=urllib.request.Request(api+'/api/checkout/live/readiness',
            headers={'Origin':origin,'User-Agent':'Douglas-Checkout-Smoke-20261103'})
          with urllib.request.urlopen(req,timeout=20) as res:state=json.load(res)
          assert state.get('checkoutEnabled') is True,state
          assert state.get('paymentProvider') == 'infinitepay',state
          assert state.get('multiCheckoutEnabled') is True,state
          expected=['salve-regina-preta-p','salve-regina-preta-m',
            'salve-regina-preta-g','salve-regina-preta-gg','salve-regina-preta-xg',
            'caneca-salve-regina-preta','caneca-salve-regina-pb',
            'ecobag-salve-regina-m','ecobag-salve-regina-g']
          assert state.get('availableSkus')==expected,state
          payload={'zipCode':'01001000','items':[{'sku':'salve-regina-preta-g','quantity':2}]}
          req=urllib.request.Request(api+'/api/shipping/cart-preview',method='POST',
            headers={'Origin':origin,'User-Agent':'Douglas-Checkout-Smoke-20261103',
              'Content-Type':'application/json'},data=json.dumps(payload).encode())
          with urllib.request.urlopen(req,timeout=22) as res:quote=json.load(res)
          assert quote.get('checkoutEnabled') is False,quote
          assert quote.get('provisional') is True,quote
          assert len(quote.get('options',[]))>0,quote
          print(json.dumps({'multiCheckoutEnabled':True,'eligible':'salve-regina-preta-g',
            'quantity':2,'carrierOptions':len(quote['options']),
            'noPaymentCreated':True},ensure_ascii=False))
          PY
