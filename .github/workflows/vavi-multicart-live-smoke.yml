name: Frete VAVI — teste real de carrinhos combinados (sem cobrança)
on:
  push:
    branches: [main]
    paths: [.github/workflows/vavi-multicart-live-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validar cotação de várias unidades e produtos diferentes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          url='https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/shipping/cart-preview'
          origin='https://www.douglasassumpcao.com.br'
          cases=[
            ('duas_camisetas',[{'sku':'salve-regina-preta-g','quantity':2}]),
            ('camiseta_e_caneca',[{'sku':'salve-regina-preta-g','quantity':1},
                                  {'sku':'caneca-salve-regina-pb','quantity':1}]),
            ('duas_ecobags',[{'sku':'ecobag-salve-regina-m','quantity':2}]),
            ('caneca_e_ecobag',[{'sku':'caneca-salve-regina-preta','quantity':1},
                                {'sku':'ecobag-salve-regina-g','quantity':1}])
          ]
          def call(items):
            req=Request(url,method='POST',data=json.dumps({
              'zipCode':'01001000','items':items}).encode(),headers={
              'Origin':origin,'Content-Type':'application/json',
              'User-Agent':'Douglas-MultiCart-SafeSmoke-20261103'})
            try:
              with urlopen(req,timeout=25) as res:return res.status,json.load(res)
            except HTTPError as ex:return ex.code,json.loads(ex.read())
          for name,items in cases:
            status,result=call(items)
            opts=result.get('options',[])
            ok=(status==200 and result.get('provisional') is True
              and result.get('packageConfirmed') is False
              and result.get('checkoutEnabled') is False
              and result.get('items')==items and len(opts)>0
              and all(isinstance(o.get('shippingCost'),(int,float))
                      and o['shippingCost']>=0 for o in opts))
            print(json.dumps({'case':name,'http':status,'delivery_options':len(opts),
              'minimum':min((x.get('shippingCost') for x in opts),default=None),
              'pass':ok,'error':result.get('error')},ensure_ascii=False),flush=True)
            if not ok:raise SystemExit('Falhou cotação: '+name)
            public=json.dumps(result)
            assert '0001589' not in public and '0002193' not in public, 'SKU privado exposto'
            assert 'observed_total_cents' not in public, 'Custo do fornecedor exposto'
          for items,expected in [
            ([{'sku':'moletom-salve-regina','quantity':1}],422),
            ([{'sku':'salve-regina-preta-g','quantity':11}],422)
          ]:
            status,result=call(items)
            assert status==expected,(status,result)
          print('PASS: sem pagamentos, sem pedidos; moletom bloqueado.',flush=True)
          PY
