name: Checkout individual — visual desktop e mobile
on:
  pull_request:
    paths:
      - 'pages/checkout-salve-regina.html'
      - 'styles/checkout-salve-regina-desktop.css'
      - 'tools/test_checkout_single_desktop.py'
      - '.github/workflows/checkout-single-desktop-visual.yml'
  push:
    branches: [main]
    paths:
      - 'pages/checkout-salve-regina.html'
      - 'styles/checkout-salve-regina-desktop.css'
      - 'tools/test_checkout_single_desktop.py'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar navegadores
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium webkit
      - name: Testar desktop, Safari e mobile sem cobrança
        run: python tools/test_checkout_single_desktop.py
