name: Teste único de frete VAVI sem UUID — somente leitura
on:
  push:
    branches: [main]
    paths: [.github/workflows/vavi-freight-one-time-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Executar consulta única de três cargas sem criar pedidos
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from urllib.error import HTTPError,URLError
          url='https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/internal/f-probe-73e54de29ea041d93be3561e87d541b33d420448e23497b9c124d29803cd6f430e6ca25a'
          req=urllib.request.Request(url,headers={
              'User-Agent':'DouglasAssumpcao-OneTime-Freight/1.0',
              'Accept':'application/json'
          })
          try:
              with urllib.request.urlopen(req,timeout=85) as resp:
                  payload=json.load(resp)
          except (HTTPError,URLError,TimeoutError,OSError) as exc:
              raise SystemExit('Falha na consulta temporária: '+type(exc).__name__)
          print(json.dumps(payload,ensure_ascii=False,indent=2),flush=True)
          if len(payload.get('results',[]))!=3:
              raise SystemExit('Resposta incompleta da API; verificar estado do probe.')
          print('Consulta somente leitura finalizada. Não criou pedidos nem pagamentos.')
          PY
