name: Vitrine VAVI — validações sem pagamentos
on:
  pull_request:
    paths:
      - "integrations/vavi-worker/**"
      - "data/vavi-catalogo.json"
      - "scripts/vavi-vitrine.js"
      - ".github/workflows/vavi-preview-tests.yml"
  push:
    branches:
      - "feature/vavi-loja-rascunho"
    paths:
      - "integrations/vavi-worker/**"
      - "data/vavi-catalogo.json"
      - "scripts/vavi-vitrine.js"
      - ".github/workflows/vavi-preview-tests.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir sintaxe do JavaScript
        run: |
          node --check scripts/vavi-vitrine.js
          node --check integrations/vavi-worker/src/index.js
          node --check integrations/vavi-worker/src/catalog.js
      - name: Validar JSON do catálogo
        run: python3 -m json.tool data/vavi-catalogo.json > /dev/null
      - name: Executar testes da sacola e preços
        working-directory: integrations/vavi-worker
        run: node --test
