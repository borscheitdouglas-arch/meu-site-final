name: Atualizar carrossel da página inicial

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "tools/generate_home_carousel.py"

permissions:
  contents: write

jobs:
  update-carousel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Gerar catálogo das páginas recentes
        run: python tools/generate_home_carousel.py
      - name: Publicar catálogo atualizado
        run: |
          if git diff --quiet -- content/home-carousel.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/home-carousel.json
          git commit -m "Atualiza carrossel automaticamente [skip ci]"
          git push
