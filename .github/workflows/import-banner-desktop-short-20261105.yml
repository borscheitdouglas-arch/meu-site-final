name: Importar arte panorâmica desktop (uso único)
on:
  push:
    branches: [feature/home-desktop-short-panorama-20261105]
    paths:
      - .github/workflows/import-banner-desktop-short-20261105.yml
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Importar arte PNG em qualidade original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          curl --fail --location --silent --show-error --retry 4 --max-time 100 'https://at.adobe.com/KObMWDuLDKEAJ3PU' -o assets/img/banner-desktop-maria-jose-panoramico-20261105.png
          echo '734ef966fc2a6dbf7ff5a4bd82f0f67ecb8d6c1dd0654d01cd8b326d86cd9bd0  assets/img/banner-desktop-maria-jose-panoramico-20261105.png' | sha256sum -c -
          file assets/img/banner-desktop-maria-jose-panoramico-20261105.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/banner-desktop-maria-jose-panoramico-20261105.png
          git commit -m 'assets(home): add high-quality panoramic art 2397x916'
          git push origin HEAD:feature/home-desktop-short-panorama-20261105
