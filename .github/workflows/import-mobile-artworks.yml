name: Importar artes da home mobile
on:
  push:
    branches:
      - feature/mobile-home-two-sacred-artworks-20261105
    paths:
      - .github/workflows/import-mobile-artworks.yml
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baixar imagens originais
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 'https://at.adobe.com/oH3YXMEfsCwcCDjh' -o /tmp/home-maria.png
          curl --fail --location --silent --show-error --retry 3 --max-time 90 'https://at.adobe.com/tFyE670QuXH8dQnq' -o /tmp/home-agnus.png
          python - <<'PY'
          from pathlib import Path
          for path in ['/tmp/home-maria.png','/tmp/home-agnus.png']:
              content=Path(path).read_bytes()
              assert content.startswith(bytes.fromhex('89504e470d0a1a0a')), f'Not a PNG: {path}'
              print(path, len(content))
          PY
      - name: Compactar para smartphone sem alterar a composição
        shell: bash
        run: |
          python -m pip -q install pillow
          mkdir -p assets/img/mobile
          python - <<'PY'
          from PIL import Image
          images=[('/tmp/home-maria.png','assets/img/mobile/mobile-home-maria.webp'),
                  ('/tmp/home-agnus.png','assets/img/mobile/mobile-home-agnus-dei.webp')]
          for original,target in images:
              im=Image.open(original).convert('RGB')
              im.thumbnail((850,1500),Image.Resampling.LANCZOS)
              im.save(target,format='WEBP',quality=77,method=6)
              print(target, im.size)
          PY
      - name: Salvar as imagens no branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/mobile/mobile-home-maria.webp assets/img/mobile/mobile-home-agnus-dei.webp
          git commit -m 'assets(mobile): add two sacred illustrations optimized for phones'
          git push origin HEAD:feature/mobile-home-two-sacred-artworks-20261105
