name: Validar catálogo da loja

on:
  pull_request:
    paths:
      - 'content/store-products.json'
      - 'pages/loja.html'
      - 'pages/colecao-salve-regina.html'
      - 'scripts/salve-regina-inquiry.js'
      - 'styles/store-book.css'
      - 'styles/salve-regina-colecao.css'
      - 'assets/img/loja/Salve-Regina/**'
      - 'tools/optimize_salve_regina_images.py'
      - 'tools/generate_store.py'
      - 'tools/test_store_catalog.py'
      - 'tools/test_salve_regina_inquiry.cjs'
      - 'tools/test_storefront.py'
      - '.github/workflows/loja-catalogo-check.yml'
  push:
    paths:
      - 'content/store-products.json'
      - 'pages/loja.html'
      - 'pages/colecao-salve-regina.html'
      - 'scripts/salve-regina-inquiry.js'
      - 'styles/store-book.css'
      - 'styles/salve-regina-colecao.css'
      - 'assets/img/loja/Salve-Regina/**'
      - 'tools/optimize_salve_regina_images.py'
      - 'tools/generate_store.py'
      - 'tools/test_store_catalog.py'
      - 'tools/test_salve_regina_inquiry.cjs'
      - 'tools/test_storefront.py'
      - '.github/workflows/loja-catalogo-check.yml'

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar HTML gerado
        run: python3 tools/generate_store.py --check
      - name: Validar catálogo e segurança dos links
        run: python3 -m unittest discover -s tools -p test_store_catalog.py
      - name: Validar JavaScript da solicitação assistida
        run: node --check scripts/salve-regina-inquiry.js
      - name: Testar comportamento da consulta de frete sem serviços externos
        run: node --test tools/test_salve_regina_inquiry.cjs
      - name: Preparar navegador de teste
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
      - name: Conferir loja responsiva e fluxo de consulta simulado
        run: python3 tools/test_storefront.py
