name: Verificar compatibilidade Orders API (uma vez)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mp-orders-compat.yml"
permissions:
  contents: read
jobs:
  orders-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invocar compatibilidade Orders sem transação
        shell: bash
        run: |
          set -euo pipefail
          URL="https://douglas-loja-api.liturgia-gregoriano.workers.dev/api/internal/mp/orders-compat-1cd6b24b429f3d82a9e4d9e7"
          for attempt in $(seq 1 25); do
            CODE=$(curl -sS -X POST -o /tmp/compat.json --connect-timeout 8 --max-time 30 -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; then
              echo "Orders diagnostic executed; inspect D1 for actual outcome."
              exit 0
            fi
            sleep 12
          done
          echo "Orders diagnostic was not invoked."
          exit 1
