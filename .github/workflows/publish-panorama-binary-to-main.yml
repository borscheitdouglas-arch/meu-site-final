name: Publicar somente PNG panorâmico original na main
on:
  push:
    branches: [feature/home-desktop-short-panorama-synced-20261105]
    paths: [.github/workflows/publish-panorama-binary-to-main.yml]
permissions:
  contents: write
jobs:
  publish-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar apenas a arte sem tocar nos outros arquivos atuais
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:assets/img/banner-desktop-maria-jose-panoramico-20261105.png > /tmp/banner-panorama.png
          echo '734ef966fc2a6dbf7ff5a4bd82f0f67ecb8d6c1dd0654d01cd8b326d86cd9bd0  /tmp/banner-panorama.png' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main --no-tags
            git checkout -B publish-main origin/main
            mkdir -p assets/img
            cp /tmp/banner-panorama.png assets/img/banner-desktop-maria-jose-panoramico-20261105.png
            git add assets/img/banner-desktop-maria-jose-panoramico-20261105.png
            if git diff --cached --quiet; then echo 'Arte já publicada'; exit 0; fi
            git commit -m 'assets(home): publish shorter lossless panoramic Maria/Jose hero'
            if git push origin HEAD:main; then echo 'Arte publicada na main'; exit 0; fi
            sleep 2
          done
          echo 'Não foi possível publicar após nova atualização concorrente da main' >&2
          exit 1
