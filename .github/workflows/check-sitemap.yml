name: Validar sitemap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Testar seleção de URLs
        run: python3 -m unittest discover -s tools -p test_sitemap.py
      - name: Conferir sitemap versionado
        run: python3 tools/generate_sitemap.py --check
